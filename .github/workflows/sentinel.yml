name: sentinel

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs by a few minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# Only one run at a time, so two runs never race on the state cache.
concurrency:
  group: sentinel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # State from the previous run, so alerts fire on changes only.
      # Each run saves under a new key; restore-keys picks the newest.
      - uses: actions/cache/restore@v4
        with:
          path: sentinel-state.json
          key: sentinel-state-${{ github.run_id }}
          restore-keys: sentinel-state-

      - name: Check sites
        env:
          SENTINEL_NTFY_URL: ${{ secrets.SENTINEL_NTFY_URL }}
          SENTINEL_DISCORD_WEBHOOK: ${{ secrets.SENTINEL_DISCORD_WEBHOOK }}
          NO_COLOR: "1"
        # Alerts come from sentinel itself, so a failing site shouldn't also
        # turn the workflow red (GitHub would email you a second time).
        run: go run . -status-file status.json || echo "::warning::one or more checks failed"

      # Publish the public summary (up/down, response time, TLS expiry only)
      # to a gist the portfolio reads. Skipped until both are configured:
      #   secret   SENTINEL_GIST_TOKEN  a token that can only write gists
      #   variable SENTINEL_GIST_ID     the gist's ID
      - name: Publish status
        env:
          GIST_TOKEN: ${{ secrets.SENTINEL_GIST_TOKEN }}
          GIST_ID: ${{ vars.SENTINEL_GIST_ID }}
        run: |
          if [ -z "$GIST_TOKEN" ] || [ -z "$GIST_ID" ]; then
            echo "Status publishing not configured; skipping."; exit 0
          fi
          test -s status.json || { echo "::warning::no status.json to publish"; exit 0; }
          jq -n --rawfile content status.json '{files: {"status.json": {content: $content}}}' > body.json
          curl --fail-with-body -sS -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" -d @body.json -o /dev/null

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: sentinel-state.json
          key: sentinel-state-${{ github.run_id }}
